name: Project status automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, synchronize, closed]
    branches:
      - develop
      - main
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-project-status:
    name: Sync linked issues to project status
    runs-on: ubuntu-latest

    steps:
      - name: Move linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || github.token }}
          script: |
            const PROJECT_ID = "PVT_kwHOBzkkhM4BVsXP";
            const STATUS_FIELD_NAME = "Status";
            const STATUS_BY_EVENT = {
              inReview: "In review",
              readyForTesting: "Ready for testing",
              done: "Done",
            };

            function getTargetStatus() {
              if (context.eventName === "issues") {
                return STATUS_BY_EVENT.done;
              }

              const pr = context.payload.pull_request;
              if (!pr) {
                return null;
              }

              if (context.payload.action === "closed") {
                if (!pr.merged) {
                  return null;
                }

                if (pr.base.ref === "develop") {
                  return STATUS_BY_EVENT.readyForTesting;
                }

                if (pr.base.ref === "main") {
                  return STATUS_BY_EVENT.done;
                }

                return null;
              }

              if (pr.draft) {
                return null;
              }

              return STATUS_BY_EVENT.inReview;
            }

            function extractClosingIssueNumbers(pr) {
              const text = [pr.title, pr.body].filter(Boolean).join("\n");
              const owner = context.repo.owner.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const repo = context.repo.repo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const pattern = new RegExp(
                String.raw`\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:https:\/\/github\.com\/${owner}\/${repo}\/issues\/|${owner}\/${repo}#|#)?(\d+)`,
                "gi",
              );
              return [...new Set([...text.matchAll(pattern)].map((match) => Number(match[1])))];
            }

            async function getStatusField() {
              const result = await github.graphql(
                `query($projectId: ID!, $fieldName: String!) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      field(name: $fieldName) {
                        ... on ProjectV2SingleSelectField {
                          id
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }`,
                { projectId: PROJECT_ID, fieldName: STATUS_FIELD_NAME },
              );

              const field = result.node?.field;
              if (!field) {
                throw new Error(`Project field not found: ${STATUS_FIELD_NAME}`);
              }

              return field;
            }

            async function getIssueProjectItem(issueNumber) {
              const result = await github.graphql(
                `query($owner: String!, $repo: String!, $issueNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issueNumber) {
                      id
                      projectItems(first: 50) {
                        nodes {
                          id
                          project {
                            id
                          }
                        }
                      }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo, issueNumber },
              );

              const issue = result.repository.issue;
              if (!issue) {
                throw new Error(`Issue not found: #${issueNumber}`);
              }

              const item = issue.projectItems.nodes.find((node) => node.project.id === PROJECT_ID);
              return { issueId: issue.id, itemId: item?.id };
            }

            async function addIssueToProject(issueId) {
              const result = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item {
                      id
                    }
                  }
                }`,
                { projectId: PROJECT_ID, contentId: issueId },
              );

              return result.addProjectV2ItemById.item.id;
            }

            async function updateStatus(itemId, fieldId, optionId) {
              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }`,
                { projectId: PROJECT_ID, itemId, fieldId, optionId },
              );
            }

            const targetStatus = getTargetStatus();
            if (!targetStatus) {
              core.info("No project status transition for this event.");
              return;
            }

            const issueNumbers =
              context.eventName === "issues"
                ? [context.payload.issue.number]
                : extractClosingIssueNumbers(context.payload.pull_request);

            if (issueNumbers.length === 0) {
              core.info("No closing issue references found.");
              return;
            }

            const statusField = await getStatusField();
            const option = statusField.options.find((candidate) => candidate.name === targetStatus);
            if (!option) {
              throw new Error(`Project status option not found: ${targetStatus}`);
            }

            for (const issueNumber of issueNumbers) {
              const { issueId, itemId } = await getIssueProjectItem(issueNumber);
              const projectItemId = itemId ?? (await addIssueToProject(issueId));
              await updateStatus(projectItemId, statusField.id, option.id);
              core.info(`Moved #${issueNumber} to ${targetStatus}.`);
            }
